---
layout: default
---
<article class="page h-entry" itemscope itemtype="http://schema.org/WebPage">

  <header class="post-header">
    {% unless page.hide_title %}
      <h1 class="page-heading">{{ page.title | escape }}</h1>
    {% endunless %}
  </header>

  <div class="post-content e-content" itemprop="text">
    {{ content }}
  </div>

</article>
